name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    # Na CI je diagnostika zapnuta zamerne: bez ni pad hooku vypada v logu jako
    # "dostano allow" a pricina nikde neni. Fail-closed to neoslabuje - blokuje se
    # dal, jen se navic rekne proc. V produkci zustava vypnuta (mohla by nest cizi text).
    env:
      SINOGARD_HOOKS_DEBUG: '1'
      # Sada nesmi strilet skutecne toasty ani modalni okna - na runneru by je
      # nemel kdo zavrit a na stroji Toma je videl on (nalez Amber B12).
      SINOGARD_HOOKS_DRYRUN: '1'
    strategy:
      fail-fast: false
      matrix:
        # Hooky se v produkci spousti pres powershell.exe (Windows PowerShell 5.1);
        # pwsh 7 se meri taky, protoze skripty maji byt kompatibilni s obema.
        interpreter: [powershell.exe, pwsh]
    steps:
      - uses: actions/checkout@v4

      - name: Verze interpretu
        shell: pwsh
        run: |
          # Jednoduche uvozovky zamerne: ve dvojitych by $PSVersionTable rozbalil
          # vnejsi pwsh jeste pred predanim dovnitr a interpret by dostal prazdno.
          & "${{ matrix.interpreter }}" -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: gate
        shell: pwsh
        run: pwsh -NoProfile -File tests/_ci-verdict.ps1 -Suite gate -Interpreter "${{ matrix.interpreter }}"

      - name: secrets
        shell: pwsh
        run: pwsh -NoProfile -File tests/_ci-verdict.ps1 -Suite secrets -Interpreter "${{ matrix.interpreter }}"

      - name: resume-cost
        shell: pwsh
        run: pwsh -NoProfile -File tests/_ci-verdict.ps1 -Suite resume-cost -Interpreter "${{ matrix.interpreter }}"

      - name: notify
        shell: pwsh
        run: pwsh -NoProfile -File tests/_ci-verdict.ps1 -Suite notify -Interpreter "${{ matrix.interpreter }}"
